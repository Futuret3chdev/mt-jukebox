<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>MT Jukebox</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0b; --elev: #141416; --subtle: #1c1c20;
      --fg: #f4f4f5; --muted: #a1a1aa; --dim: #71717a;
      --accent: #c8ccd4; --accent-fg: #0a0a0b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: "IBM Plex Sans", sans-serif; }
    .app { min-height: 100dvh; padding: 24px 16px calc(32px + env(safe-area-inset-bottom)); max-width: 28rem; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .brand img { width: 40px; height: 40px; object-fit: contain; }
    .kicker { font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); font-weight: 500; margin: 0; }
    h1 { font-family: Fraunces, serif; font-size: 2rem; font-weight: 500; letter-spacing: -0.03em; margin: 4px 0 24px; }
    h2 { font-family: Fraunces, serif; font-size: 1.35rem; font-weight: 500; margin: 0 0 4px; }
    p.lead { color: var(--muted); }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .btn { height: 48px; border-radius: 12px; font-weight: 600; width: 100%; }
    .btn.primary { background: var(--accent); color: var(--accent-fg); }
    .btn.ghost { background: var(--elev); }
    .row-btns { display: flex; gap: 12px; margin: 20px 0; }
    .row-btns .btn { flex: 1; }
    .disc-wrap { display: grid; place-items: center; margin-bottom: 24px; }
    .disc {
      width: 220px; height: 220px; border-radius: 50%; position: relative; overflow: hidden;
      background: radial-gradient(circle at 50% 50%, transparent 0 32%, #17171a 32.5%),
        repeating-radial-gradient(circle at 50% 50%, #17171a 0 2px, #111113 3px 6px);
      box-shadow: inset 0 0 0 10px #0c0c0e;
    }
    .disc.spin { animation: spin 8s linear infinite; }
    .disc img { position: absolute; inset: 33%; width: 34%; height: 34%; object-fit: contain; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .disc.spin { animation: none; } }
    .now { text-align: center; margin-bottom: 20px; }
    .now p { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .bar { height: 4px; background: var(--subtle); border-radius: 99px; overflow: hidden; margin: 16px 0 8px; }
    .bar > span { display: block; height: 100%; background: var(--accent); width: 0; }
    .times { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; color: var(--dim); font-size: 0.75rem; }
    .meta { display: flex; justify-content: space-between; color: var(--dim); font-size: 0.8rem; }
    .panel { background: var(--elev); border-radius: 20px; padding: 16px; margin-top: 16px; }
    .panel h3 { margin: 0 0 12px; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); font-weight: 500; }
    .row { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 0; border-top: 1px solid color-mix(in oklab, var(--fg) 12%, transparent); }
    .row:first-of-type { border-top: 0; }
    .row strong { display: block; font-weight: 500; }
    .row span { color: var(--muted); font-size: 0.8rem; }
    .row button { margin-left: auto; height: 36px; padding: 0 14px; border-radius: 8px; background: var(--subtle); font-size: 0.8rem; font-weight: 500; }
    .hint { color: var(--dim); font-size: 0.8rem; margin-top: 16px; }
    input[type="text"] {
      width: 100%; height: 44px; border-radius: 8px; border: 1px solid color-mix(in oklab, var(--fg) 12%, transparent);
      background: var(--bg); color: var(--fg); padding: 0 12px; margin: 8px 0 16px; font: inherit;
    }
    label { font-size: 0.8rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="app" id="app"></div>
  <audio id="audio" playsinline></audio>
  <script>
    const TRACKS = [
      { id: "night", title: "Night Garden", artist: "MT House", url: "https://cdn.jsdelivr.net/gh/Futuret3chdev/mt-jukebox@main/public/tracks/night-garden.mp3", duration: 16 },
      { id: "lot", title: "Lot Lights", artist: "MT House", url: "https://cdn.jsdelivr.net/gh/Futuret3chdev/mt-jukebox@main/public/tracks/lot-lights.mp3", duration: 16 },
      { id: "empty", title: "Empty House", artist: "MT House", url: "https://cdn.jsdelivr.net/gh/Futuret3chdev/mt-jukebox@main/public/tracks/empty-house.mp3", duration: 16 },
    ];
    const LOGO = "https://memetorrent.futuret3ch.com.au/logo.png";
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor("#0a0a0b"); }
    const me = tg && tg.initDataUnsafe && tg.initDataUnsafe.user
      ? { id: String(tg.initDataUnsafe.user.id), name: tg.initDataUnsafe.user.first_name }
      : { id: "guest", name: sessionStorage.getItem("jb-name") || "Guest" };

    let joined = false;
    let current = null;
    let paused = true;
    let queue = [];
    const audio = document.getElementById("audio");

    function fmt(s) {
      if (!isFinite(s) || s < 0) return "0:00";
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ":" + String(sec).padStart(2, "0");
    }

    function start(track) {
      current = track;
      paused = false;
      audio.src = track.url;
      audio.play().catch(() => {});
      render();
    }

    function render() {
      const app = document.getElementById("app");
      if (!joined) {
        app.innerHTML = `
          <div class="brand"><img src="${LOGO}" alt="MemeTorrent" /><p class="kicker">MemeTorrent</p></div>
          <h1>Jukebox</h1>
          <p class="lead">One room. One queue. Open this from SoftwareTesters and hit Join so the speaker can play.</p>
          <label for="name">Your name</label>
          <input id="name" type="text" value="${me.name === "Guest" ? "" : me.name}" placeholder="Name in the room" />
          <button class="btn primary" id="join">Join the room</button>
          <p class="hint">iPhone needs this tap.</p>`;
        document.getElementById("join").onclick = () => {
          const n = document.getElementById("name").value.trim();
          if (n) { me.name = n; sessionStorage.setItem("jb-name", n); }
          joined = true;
          render();
        };
        return;
      }
      const dur = (current && (audio.duration || current.duration)) || 16;
      const t = audio.currentTime || 0;
      const pct = dur > 0 ? Math.min(100, (t / dur) * 100) : 0;
      app.innerHTML = `
        <div class="brand"><img src="${LOGO}" alt="MemeTorrent" /><p class="kicker">MemeTorrent · live</p></div>
        <h1>Jukebox</h1>
        <div class="disc-wrap"><div class="disc ${current && !paused ? "spin" : ""}"><img src="${LOGO}" alt="" /></div></div>
        <div class="now">
          <h2>${current ? current.title : "Nothing on"}</h2>
          <p>${current ? current.artist + " · " + me.name : "Queue a track from the library"}</p>
          <div class="bar"><span style="width:${pct}%"></span></div>
          <div class="times"><span>${fmt(t)}</span><span>${fmt(dur)}</span></div>
        </div>
        <div class="row-btns">
          <button class="btn primary" id="play">${current && !paused ? "Pause" : "Play"}</button>
          <button class="btn ghost" id="skip">Skip</button>
        </div>
        <p class="meta"><span>You have the aux</span><span>SoftwareTesters</span></p>
        <div class="panel">
          <h3>Library</h3>
          ${TRACKS.map((tr) => `<div class="row"><div><strong>${tr.title}</strong><span>${tr.artist}</span></div><button data-q="${tr.id}">Queue</button></div>`).join("")}
        </div>`;
      document.getElementById("play").onclick = () => {
        if (!current) { start(queue.shift() || TRACKS[0]); return; }
        if (paused) { paused = false; audio.play().catch(() => {}); }
        else { paused = true; audio.pause(); }
        render();
      };
      document.getElementById("skip").onclick = () => {
        const next = queue.shift();
        if (next) start(next);
        else { current = null; paused = true; audio.pause(); audio.removeAttribute("src"); render(); }
      };
      app.querySelectorAll("[data-q]").forEach((btn) => {
        btn.onclick = () => {
          const track = TRACKS.find((x) => x.id === btn.getAttribute("data-q"));
          if (!track) return;
          if (!current) start(track);
          else queue.push(track);
          render();
        };
      });
    }

    audio.addEventListener("timeupdate", () => { if (joined && current) render(); });
    audio.addEventListener("ended", () => {
      const next = queue.shift();
      if (next) start(next);
      else { current = null; paused = true; render(); }
    });
    render();
  </script>
</body>
</html>
