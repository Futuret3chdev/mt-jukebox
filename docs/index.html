<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>MT Jukebox</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0b; --elev: #141416; --subtle: #1c1c20;
      --fg: #f4f4f5; --muted: #a1a1aa; --dim: #71717a;
      --accent: #c8ccd4; --accent-fg: #0a0a0b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: "IBM Plex Sans", sans-serif; }
    .app { min-height: 100dvh; padding: 24px 16px calc(32px + env(safe-area-inset-bottom)); max-width: 28rem; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .brand img { width: 40px; height: 40px; object-fit: contain; }
    .kicker { font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); font-weight: 500; margin: 0; }
    h1 { font-family: Fraunces, serif; font-size: 2rem; font-weight: 500; letter-spacing: -0.03em; margin: 4px 0 24px; }
    h2 { font-family: Fraunces, serif; font-size: 1.35rem; font-weight: 500; margin: 0 0 4px; }
    p.lead { color: var(--muted); }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .btn { height: 48px; border-radius: 12px; font-weight: 600; width: 100%; }
    .btn.primary { background: var(--accent); color: var(--accent-fg); }
    .btn.ghost { background: var(--elev); }
    .row-btns { display: flex; gap: 12px; margin: 20px 0; }
    .row-btns .btn { flex: 1; }
    .disc-wrap { display: grid; place-items: center; margin-bottom: 24px; }
    .disc {
      width: 220px; height: 220px; border-radius: 50%; position: relative; overflow: hidden;
      background: radial-gradient(circle at 50% 50%, transparent 0 32%, #17171a 32.5%),
        repeating-radial-gradient(circle at 50% 50%, #17171a 0 2px, #111113 3px 6px);
      box-shadow: inset 0 0 0 10px #0c0c0e;
    }
    .disc.spin { animation: spin 8s linear infinite; }
    .disc img { position: absolute; inset: 33%; width: 34%; height: 34%; object-fit: contain; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .disc.spin { animation: none; } }
    .now { text-align: center; margin-bottom: 20px; }
    .now p { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .bar { height: 4px; background: var(--subtle); border-radius: 99px; overflow: hidden; margin: 16px 0 8px; }
    .bar > span { display: block; height: 100%; background: var(--accent); width: 0; }
    .times { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; color: var(--dim); font-size: 0.75rem; }
    .meta { display: flex; justify-content: space-between; color: var(--dim); font-size: 0.8rem; }
    .panel { background: var(--elev); border-radius: 20px; padding: 16px; margin-top: 16px; }
    .panel h3 { margin: 0 0 12px; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); font-weight: 500; }
    .row { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 0; border-top: 1px solid color-mix(in oklab, var(--fg) 12%, transparent); }
    .row:first-of-type { border-top: 0; }
    .row strong { display: block; font-weight: 500; }
    .row span { color: var(--muted); font-size: 0.8rem; }
    .row button { margin-left: auto; height: 36px; padding: 0 14px; border-radius: 8px; background: var(--subtle); font-size: 0.8rem; font-weight: 500; }
    .hint, .err { color: var(--dim); font-size: 0.8rem; margin-top: 12px; }
    .err { color: #fca5a5; }
    input[type="text"] {
      width: 100%; height: 44px; border-radius: 8px; border: 1px solid color-mix(in oklab, var(--fg) 12%, transparent);
      background: var(--bg); color: var(--fg); padding: 0 12px; margin: 8px 0 16px; font: inherit;
    }
    label { font-size: 0.8rem; color: var(--muted); }
    .hidden-file { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="brand"><img src="https://memetorrent.futuret3ch.com.au/logo.png" alt="MemeTorrent" /><p class="kicker">MemeTorrent</p></div>
    <h1>Jukebox</h1>
    <p class="lead">One room. Everyone who opens this hears the same track.</p>
  </div>
  <audio id="audio" playsinline></audio>
  <script>
    const FALLBACK = [
      { id: "demo-night", title: "Night Garden", artist: "MT House", url: "https://cdn.jsdelivr.net/gh/Futuret3chdev/mt-jukebox@main/public/tracks/night-garden.mp3", addedBy: "Library", duration: 16 },
      { id: "demo-lot", title: "Lot Lights", artist: "MT House", url: "https://cdn.jsdelivr.net/gh/Futuret3chdev/mt-jukebox@main/public/tracks/lot-lights.mp3", addedBy: "Library", duration: 16 },
      { id: "demo-empty", title: "Empty House", artist: "MT House", url: "https://cdn.jsdelivr.net/gh/Futuret3chdev/mt-jukebox@main/public/tracks/empty-house.mp3", addedBy: "Library", duration: 16 },
    ];
    const LOGO = "https://memetorrent.futuret3ch.com.au/logo.png";
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor("#0a0a0b"); }
    const me = tg && tg.initDataUnsafe && tg.initDataUnsafe.user
      ? { id: String(tg.initDataUnsafe.user.id), name: tg.initDataUnsafe.user.first_name }
      : { id: "guest-" + Math.random().toString(36).slice(2, 8), name: sessionStorage.getItem("jb-name") || "Guest" };

    let joined = false;
    let room = { current: null, paused: true, startedAt: null, pausePos: 0, queue: [], library: FALLBACK, listeners: [], hostId: null, hostName: "" };
    let err = "";
    const audio = document.getElementById("audio");

    function fmt(s) {
      if (!isFinite(s) || s < 0) return "0:00";
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ":" + String(sec).padStart(2, "0");
    }
    function pos() {
      if (!room.current) return 0;
      if (room.paused) return room.pausePos || 0;
      if (!room.startedAt) return 0;
      return Math.max(0, (Date.now() - room.startedAt) / 1000);
    }
    function abs(url) {
      try { return new URL(url, location.origin).href; } catch { return url; }
    }

    async function pull() {
      try {
        const q = new URLSearchParams({ id: me.id, name: me.name });
        const res = await fetch("/api/room?" + q);
        if (!res.ok) throw new Error("room");
        room = await res.json();
        err = "";
        syncAudio();
        paint();
      } catch (e) {
        err = "Room not linked yet — only you can hear this phone.";
      }
    }

    async function act(type, extra) {
      const res = await fetch("/api/room", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type, id: me.id, name: me.name, ...(extra || {}) }),
      });
      if (res.ok) {
        room = await res.json();
        err = "";
        syncAudio();
        paint();
      } else {
        err = "Could not update the room";
        paint();
      }
    }

    function syncAudio() {
      if (!joined || !room.current || room.current.kind === "spotify") {
        if (!room.current) audio.pause();
        return;
      }
      const href = abs(room.current.url);
      if (audio.src !== href) audio.src = room.current.url;
      const want = pos();
      if (Math.abs((audio.currentTime || 0) - want) > 0.9) audio.currentTime = want;
      if (room.paused) audio.pause();
      else audio.play().catch(() => {});
    }

    async function upload(file) {
      err = "";
      paint();
      const q = new URLSearchParams({ title: file.name.replace(/\.[^.]+$/, ""), name: me.name, id: me.id });
      const res = await fetch("/api/room?" + q, { method: "POST", body: file });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        err = data.error || "Could not add that file";
        paint();
        return;
      }
      room = data;
      syncAudio();
      paint();
    }

    function paintJoin() {
      document.getElementById("app").innerHTML = `
        <div class="brand"><img src="${LOGO}" alt="MemeTorrent" /><p class="kicker">MemeTorrent</p></div>
        <h1>Jukebox</h1>
        <p class="lead">One room. Everyone who opens this hears the same track at the same time.</p>
        <label for="name">Your name</label>
        <input id="name" type="text" value="${me.name === "Guest" ? "" : me.name}" placeholder="Name in the room" />
        <button class="btn primary" id="join">Join the room</button>
        <p class="hint">iPhone needs this tap so sound is allowed.</p>`;
      document.getElementById("join").onclick = () => {
        const n = document.getElementById("name").value.trim();
        if (n) { me.name = n; sessionStorage.setItem("jb-name", n); }
        joined = true;
        paint();
        pull();
        setInterval(pull, 1000);
        setInterval(() => { if (joined) tickBar(); }, 250);
      };
    }

    function rows(list, withQueue) {
      if (!list.length) return `<p class="hint">Empty</p>`;
      return list.map((tr) => `
        <div class="row">
          <div><strong>${escapeHtml(tr.title)}</strong><span>${escapeHtml(tr.artist || tr.addedBy || "")}</span></div>
          ${withQueue ? `<button data-q="${tr.id}">Queue</button>` : ""}
        </div>`).join("");
    }

    function escapeHtml(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => {
        if (c === "&") return "&";
        if (c === "<") return "<";
        if (c === ">") return ">";
        if (c === '"') return "&#34;";
        return "&#39;";
      });
    }

    function tickBar() {
      const bar = document.querySelector(".bar > span");
      const times = document.querySelectorAll(".times span");
      if (!bar || !room.current) return;
      const dur = room.current.duration || audio.duration || 0;
      const t = pos();
      bar.style.width = dur ? Math.min(100, (t / dur) * 100) + "%" : "0";
      if (times[0]) times[0].textContent = fmt(t);
      if (times[1]) times[1].textContent = fmt(dur);
    }

    function paint() {
      if (!joined) return paintJoin();
      const cur = room.current;
      const dur = (cur && (cur.duration || audio.duration)) || 0;
      const t = pos();
      const pct = dur ? Math.min(100, (t / dur) * 100) : 0;
      const nListen = (room.listeners && room.listeners.length) || 1;
      document.getElementById("app").innerHTML = `
        <div class="brand"><img src="${LOGO}" alt="MemeTorrent" /><p class="kicker">MemeTorrent · live</p></div>
        <h1>Jukebox</h1>
        <div class="disc-wrap"><div class="disc ${cur && !room.paused ? "spin" : ""}"><img src="${LOGO}" alt="" /></div></div>
        <div class="now">
          <h2>${cur ? escapeHtml(cur.title) : "Nothing on"}</h2>
          <p>${cur ? escapeHtml(cur.artist) + " · " + escapeHtml(cur.addedBy) : "Queue a track or upload an mp3"}</p>
          <div class="bar"><span style="width:${pct}%"></span></div>
          <div class="times"><span>${fmt(t)}</span><span>${fmt(dur)}</span></div>
        </div>
        <div class="row-btns">
          <button class="btn primary" id="play">${cur && !room.paused ? "Pause" : "Play"}</button>
          <button class="btn ghost" id="skip">Skip</button>
        </div>
        <p class="meta"><span>${nListen} in the room</span><span>${room.hostId === me.id || !room.hostId ? "You have the aux" : "Host · " + escapeHtml(room.hostName || "someone")}</span></p>
        <div class="panel">
          <h3>Add mp3s</h3>
          <button class="btn ghost" id="up">Upload from this phone</button>
          <input id="file" class="hidden-file" type="file" accept="audio/*,.mp3,.m4a,.wav,.aac" multiple />
          <p class="hint">Several files at once. Over 4.5 MB — drop them in SoftwareTesters.</p>
        </div>
        <div class="panel">
          <h3>Up next (${(room.queue || []).length})</h3>
          ${rows(room.queue || [], false)}
        </div>
        <div class="panel">
          <h3>Library</h3>
          ${rows(room.library && room.library.length ? room.library : FALLBACK, true)}
        </div>
        ${err ? `<p class="err">${escapeHtml(err)}</p>` : `<p class="hint">Keep this open to hear the room. Play also posts the track in SoftwareTesters.</p>`}`;
      document.getElementById("play").onclick = () => act("play");
      document.getElementById("skip").onclick = () => act("skip");
      document.getElementById("up").onclick = () => document.getElementById("file").click();
      document.getElementById("file").onchange = (e) => {
        const files = [...(e.target.files || [])];
        e.target.value = "";
        files.forEach((f) => upload(f));
      };
      document.querySelectorAll("[data-q]").forEach((btn) => {
        btn.onclick = () => act("queue", { trackId: btn.getAttribute("data-q") });
      });
    }

    audio.addEventListener("ended", () => { if (room.hostId === me.id) act("skip"); });
    paintJoin();
  </script>
</body>
</html>
