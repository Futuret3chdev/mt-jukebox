<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>MT Radio</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0b; --elev: #141416; --subtle: #1c1c20;
      --fg: #f4f4f5; --muted: #a1a1aa; --dim: #71717a;
      --accent: #c8ccd4; --accent-fg: #0a0a0b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: "IBM Plex Sans", sans-serif; }
    .app { min-height: 100dvh; padding: 24px 16px calc(32px + env(safe-area-inset-bottom)); max-width: 28rem; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .brand img { width: 40px; height: 40px; object-fit: contain; }
    .kicker { font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); font-weight: 500; margin: 0; }
    h1 { font-family: Fraunces, serif; font-size: 2rem; font-weight: 500; letter-spacing: -0.03em; margin: 4px 0 8px; }
    h2 { font-family: Fraunces, serif; font-size: 1.35rem; font-weight: 500; margin: 0 0 4px; }
    p.lead { color: var(--muted); margin: 0 0 20px; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    a.btn, .btn { height: 48px; border-radius: 12px; font-weight: 600; width: 100%; display: grid; place-items: center; text-decoration: none; color: inherit; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    .btn.primary, a.btn.primary { background: var(--accent); color: var(--accent-fg); }
    .btn.ghost, a.btn.ghost { background: var(--elev); }
    .row-btns { display: flex; gap: 12px; margin: 20px 0; }
    .row-btns .btn { flex: 1; }
    .cover-wrap { display: grid; place-items: center; margin: 8px 0 20px; }
    .cover {
      width: min(72vw, 280px); height: min(72vw, 280px); border-radius: 28px; overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
      background: #111;
    }
    .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cover.live { box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 40px rgba(212,175,55,.25); }
    .now { text-align: center; margin-bottom: 8px; }
    .transport { display: flex; justify-content: center; align-items: center; gap: 16px; margin: 8px 0 16px; }
    .transport .btn { width: 56px; height: 56px; border-radius: 50%; flex: none; font-size: 1.25rem; }
    .transport .go { width: 72px; height: 72px; background: var(--accent); color: var(--accent-fg); font-size: 1.6rem; }
    .now { text-align: center; margin-bottom: 20px; }
    .now p { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .bar { height: 4px; background: var(--subtle); border-radius: 99px; overflow: hidden; margin: 16px 0 8px; }
    .bar > span { display: block; height: 100%; background: var(--accent); width: 0; }
    .times { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; color: var(--dim); font-size: 0.75rem; }
    .meta { display: flex; justify-content: space-between; color: var(--dim); font-size: 0.8rem; }
    .panel { background: var(--elev); border-radius: 20px; padding: 16px; margin-top: 16px; }
    .panel h3 { margin: 0 0 12px; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); font-weight: 500; }
    .row { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 0; border-top: 1px solid color-mix(in oklab, var(--fg) 12%, transparent); }
    .row:first-of-type { border-top: 0; }
    .row strong { display: block; font-weight: 500; }
    .row span { color: var(--muted); font-size: 0.8rem; }
    .row button { margin-left: auto; height: 36px; padding: 0 14px; border-radius: 8px; background: var(--subtle); font-size: 0.8rem; font-weight: 500; }
    .hint, .err { color: var(--dim); font-size: 0.8rem; margin-top: 12px; }
    .err { color: #fca5a5; }
    input[type="text"], textarea {
      width: 100%; border-radius: 8px; border: 1px solid color-mix(in oklab, var(--fg) 12%, transparent);
      background: var(--bg); color: var(--fg); padding: 0 12px; margin: 8px 0 12px; font: inherit;
    }
    input[type="text"] { height: 44px; }
    textarea { min-height: 72px; padding: 10px 12px; resize: vertical; -webkit-user-select: text; user-select: text; }
    label { font-size: 0.8rem; color: var(--muted); }
    input[type="file"] { width: 100%; margin: 8px 0 4px; color: var(--fg); font: inherit; }
    .made { margin-top: 20px; color: var(--dim); font-size: 0.75rem; letter-spacing: 0.04em; text-align: center; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="brand"><img src="https://memetorrent.futuret3ch.com.au/logo.png" alt="MemeTorrent" /><p class="kicker">MT ecosystem</p></div>
    <h1>MT Radio</h1>
    <p class="lead">Made by FutureT3ch and MemeTorrent. Tap Join live — that opens the group voice chat.</p>
    <a class="btn primary" href="https://t.me/joinchat/WgogJ0YgKAQzN2Q9">Join live stream</a>
  </div>
  <audio id="audio" playsinline></audio>
  <script>
    const LIVE = "https://t.me/joinchat/WgogJ0YgKAQzN2Q9";
    const GROUP = "https://t.me/joinchat/WgogJ0YgKAQzN2Q9";
    const LOGO = "https://memetorrent.futuret3ch.com.au/logo.png";
    const RADIO = "/radio.jpg";
    const STATION = "MT Radio";
    const TAGLINE = "MT ecosystem · made by FutureT3ch and MemeTorrent";
    const tg = window.Telegram && window.Telegram.WebApp;
    try {
      if (tg) {
        if (tg.ready) tg.ready();
        if (tg.expand) tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor("#0a0a0b");
      }
    } catch (e) {}
    const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
    const tgName = u
      ? [u.first_name, u.last_name].filter(Boolean).join(" ").trim() || u.username || "Guest"
      : "";
    let storedName = "Guest";
    try { storedName = sessionStorage.getItem("jb-name") || "Guest"; } catch (e) {}
    const me = u
      ? { id: String(u.id), name: tgName, username: u.username || "" }
      : { id: "guest-" + Math.random().toString(36).slice(2, 8), name: storedName, username: "" };
    const initData = (tg && tg.initData) || "";

    let joined = false;
    let room = { current: null, paused: true, startedAt: null, pausePos: 0, queue: [], library: [], listeners: [], hostId: null, hostName: "", isAdmin: false, live: LIVE, station: { name: STATION, tagline: TAGLINE } };
    let err = "";
    let lyrics = "";
    let showLyrics = false;
    let srcDraft = "";
    let busy = "";
    let holdPaint = 0;
    const audio = document.getElementById("audio");

    function fmt(s) {
      if (!isFinite(s) || s < 0) return "0:00";
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ":" + String(sec).padStart(2, "0");
    }
    function pos() {
      if (!room.current) return 0;
      if (room.paused) return room.pausePos || 0;
      if (!room.startedAt) return 0;
      return Math.max(0, (Date.now() - room.startedAt) / 1000);
    }
    function liveHref() {
      return LIVE;
    }
    function openLive(e) {
      if (e) e.preventDefault();
      try {
        if (tg && tg.openTelegramLink) {
          tg.openTelegramLink(LIVE);
          return false;
        }
      } catch (err) {}
      try { location.href = LIVE; } catch (e2) {}
      return false;
    }
    function abs(url) {
      try { return new URL(url, location.origin).href; } catch (e) { return url; }
    }
    function authHeaders() {
      var h = { "Content-Type": "application/json" };
      if (initData) h["X-Telegram-Init-Data"] = initData;
      return h;
    }

    function editing() {
      var a = document.activeElement;
      if (!a) return false;
      return a.id === "src" || a.id === "file" || a.tagName === "TEXTAREA" || a.tagName === "INPUT";
    }

    async function pull() {
      try {
        const q = new URLSearchParams({ id: me.id, name: me.name });
        const res = await fetch("/api/room?" + q, { headers: authHeaders() });
        if (!res.ok) throw new Error("room");
        room = await res.json();
        if (err && /room|linked|update the room/i.test(err)) err = "";
        syncAudio();
        if (busy || editing() || Date.now() < holdPaint) {
          tickBar();
          return;
        }
        paint();
      } catch (e) {
        if (!busy) err = "Could not reach MT Radio.";
      }
    }

    async function act(type, extra) {
      const res = await fetch("/api/room", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({ type, id: me.id, name: me.name, initData: initData, ...(extra || {}) }),
      });
      const data = await res.json().catch(function () { return {}; });
      if (res.ok) {
        room = data;
        if (!busy) err = "";
        syncAudio();
        if (!busy && !editing()) paint();
      } else {
        err = data.error || "Only group admins can DJ.";
        if (data.live) room.live = data.live;
        if (!editing()) paint();
      }
    }

    function ytId(url) {
      var m = String(url || "").match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{6,})/);
      return m ? m[1] : "";
    }
    function twitchChan(url) {
      var m = String(url || "").match(/twitch\.tv\/([A-Za-z0-9_]+)/i);
      return m ? m[1] : "";
    }
    function syncAudio() {
      if (!room.current || room.current.kind === "spotify" || room.current.kind === "station") {
        try { audio.pause(); } catch (e) {}
        return;
      }
      if (["youtube", "twitch", "kick", "radio"].indexOf(room.current.kind || "") >= 0) {
        try { audio.pause(); } catch (e) {}
        return;
      }
      const href = abs(room.current.url);
      if (href && audio.src !== href) audio.src = room.current.url;
      const want = pos();
      if (Math.abs((audio.currentTime || 0) - want) > 0.9) audio.currentTime = want;
      if (room.paused) audio.pause();
      else audio.play().catch(function () {});
    }
    function ensureVideo() {
      var wrap = document.getElementById("videowrap");
      if (!wrap) return;
      var cur = room.current;
      if (!cur || room.paused) return;
      var key = cur.id + ":" + (cur.kind || "");
      if (ensureVideo.key === key && wrap.firstChild) return;
      ensureVideo.key = key;
      var t = Math.floor(pos());
      if (cur.kind === "youtube") {
        var id = ytId(cur.url);
        wrap.innerHTML = id
          ? '<iframe src="https://www.youtube.com/embed/' + id + "?start=" + t + '&autoplay=1" allow="autoplay;encrypted-media" style="width:100%;aspect-ratio:16/9;border:0;border-radius:12px;margin:8px 0"></iframe>'
          : "";
      } else if (cur.kind === "twitch") {
        var ch = twitchChan(cur.url);
        wrap.innerHTML = ch
          ? '<iframe src="https://player.twitch.tv/?channel=' + encodeURIComponent(ch) + '&parent=mt-house-jukebox.vercel.app&autoplay=true" allow="autoplay" style="width:100%;aspect-ratio:16/9;border:0;border-radius:12px;margin:8px 0"></iframe>'
          : "";
      } else if (cur.kind === "video" || /\.(mp4|webm|mov)(\?|$)/i.test(cur.url || "")) {
        wrap.innerHTML = '<video src="' + escapeHtml(abs(cur.url)) + '" autoplay playsinline controls style="width:100%;border-radius:12px;margin:8px 0"></video>';
        var v = wrap.querySelector("video");
        if (v) v.currentTime = t;
      } else {
        wrap.innerHTML = "";
        ensureVideo.key = "";
      }
    }

    async function hostFile(file) {
      try {
        var fd = new FormData();
        fd.append("file", file);
        var r = await fetch("https://tmpfiles.org/api/v1/upload", { method: "POST", body: fd });
        var j = await r.json();
        var u = j && j.data && j.data.url;
        if (u) return String(u).replace("://tmpfiles.org/", "://tmpfiles.org/dl/");
      } catch (e) {}
      try {
        var fd2 = new FormData();
        fd2.append("reqtype", "fileupload");
        fd2.append("fileToUpload", file);
        var r2 = await fetch("https://litterbox.catbox.moe/resources/internals/api.php", { method: "POST", body: fd2 });
        var t = (await r2.text()).trim();
        if (t.indexOf("http") === 0) return t;
      } catch (e2) {}
      try {
        var fd3 = new FormData();
        fd3.append("reqtype", "fileupload");
        fd3.append("fileToUpload", file);
        var r3 = await fetch("https://catbox.moe/user/api.php", { method: "POST", body: fd3 });
        var t3 = (await r3.text()).trim();
        if (t3.indexOf("http") === 0) return t3;
      } catch (e3) {}
      return "";
    }

    async function upload(file) {
      bootRoom();
      if (!file) return;
      if (!room.isAdmin) {
        err = "Only group admins can add tracks. Tap Join live to listen.";
        paint();
        return;
      }
      if (file.size < 200) {
        err = "That pick was empty. Use Files, not Photos.";
        paint();
        return;
      }
      err = "Adding " + file.name + "…";
      paint();
      try {
        if (file.size > 3500000) {
          const url = await hostFile(file);
          if (!url) {
            err = "Could not send " + file.name + ". Try again, or send the file to @Mtradiobot.";
            paint();
            return;
          }
          await act("addUrl", { url: url, title: file.name.replace(/\.[^.]+$/, "") });
          return;
        }
        const q = new URLSearchParams({
          title: file.name.replace(/\.[^.]+$/, ""),
          name: me.name,
          id: me.id,
        });
        const buf = await file.arrayBuffer();
        const res = await fetch("/api/room?" + q, {
          method: "POST",
          headers: Object.assign({ "Content-Type": file.type || "application/octet-stream" }, initData ? { "X-Telegram-Init-Data": initData } : {}),
          body: buf,
        });
        const data = await res.json().catch(function () { return {}; });
        if (!res.ok) {
          err = data.error || "Could not add " + file.name;
          paint();
          return;
        }
        room = data;
        err = "";
        syncAudio();
        paint();
      } catch (e) {
        err = "Could not add " + file.name + ". Send it to @Mtradiobot.";
        paint();
      }
    }

    async function addUrl(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      if (addUrl.lock && Date.now() < addUrl.lock) return;
      addUrl.lock = Date.now() + 1500;
      holdPaint = Date.now() + 4000;
      var el = document.getElementById("src");
      var url = ((el && el.value) || srcDraft || "").trim();
      srcDraft = url;
      if (!url) {
        err = "Paste a YouTube, radio, or stream link first.";
        paint();
        return;
      }
      busy = "Adding stream…";
      err = "Adding stream… keep this open.";
      paint();
      try {
        await act("addUrl", { url: url, title: "" });
        srcDraft = "";
        err = "Stream added.";
      } catch (e2) {
        err = "Could not add that stream.";
      }
      busy = "";
      paint();
    }

    function rows(list, mode) {
      if (!list.length) return '<p class="hint">' + (mode === "queue" ? "Nothing queued" : "No files yet") + "</p>";
      return list.map(function (tr) {
        var btns = "";
        if (room.isAdmin && mode === "queue") btns = '<button data-rm="' + tr.id + '">Remove</button>';
        if (room.isAdmin && mode === "library") btns = '<button data-q="' + tr.id + '">Queue</button><button data-del="' + tr.id + '">Delete</button>';
        return '<div class="row"><div><strong>' + escapeHtml(tr.title) + "</strong><span>" + escapeHtml((tr.kind ? tr.kind + " · " : "") + (tr.artist || tr.addedBy || "")) + "</span></div>" + btns + "</div>";
      }).join("");
    }

    function escapeHtml(s) {
      return String(s || "").replace(/[&<>"']/g, function (c) {
        if (c === "&") return "&";
        if (c === "<") return "<";
        if (c === ">") return ">";
        if (c === '"') return "&#34;";
        return "&#39;";
      });
    }

    function tickBar() {
      const bar = document.querySelector(".bar > span");
      const times = document.querySelectorAll(".times span");
      if (!bar || !room.current) return;
      const dur = room.current.duration || audio.duration || 0;
      const t = pos();
      bar.style.width = dur ? Math.min(100, (t / dur) * 100) + "%" : "0";
      if (times[0]) times[0].textContent = fmt(t);
      if (times[1]) times[1].textContent = fmt(dur);
    }

    function liveButton() {
      return '<a class="btn primary" id="live" href="' + escapeHtml(liveHref()) + '" style="margin: 8px 0 12px">Join live stream</a>';
    }

    function paint() {
      const cur = room.current;
      const onAir = !!(cur && !room.paused);
      const dur = (cur && (cur.duration || audio.duration)) || 0;
      const t = pos();
      const pct = dur ? Math.min(100, (t / dur) * 100) : 0;
      const title = cur ? cur.title : STATION;
      const sub = cur ? ((cur.artist || "") + (cur.addedBy ? " · " + cur.addedBy : "")) : TAGLINE;
      const admin = !!room.isAdmin;
      var srcEl = document.getElementById("src");
      if (srcEl) srcDraft = srcEl.value;
      var hadSrc = document.activeElement && document.activeElement.id === "src";
      var sel = srcEl ? srcEl.selectionStart : srcDraft.length;
      document.getElementById("app").innerHTML =
        '<div class="brand"><img src="' + LOGO + '" alt="MemeTorrent" /><p class="kicker">MT Radio · $MT</p></div>' +
        "<h1>Now playing</h1>" +
        '<div class="cover-wrap"><div class="cover ' + (onAir ? "live" : "") + '"><img src="' + RADIO + '" alt="$MT Radio" /></div></div>' +
        '<div class="now"><h2>' + escapeHtml(title) + "</h2><p>" + escapeHtml(sub || TAGLINE) + "</p>" +
        '<div class="bar"><span style="width:' + pct + '%"></span></div>' +
        '<div class="times"><span>' + fmt(t) + "</span><span>" + fmt(dur) + "</span></div></div>" +
        '<div id="videowrap"></div>' +
        (admin
          ? '<div class="transport"><button class="btn ghost go" id="play" aria-label="Play or pause">' + (onAir ? "⏸" : "▶") + '</button><button class="btn ghost" id="skip" aria-label="Skip">⏭</button></div>'
          : "") +
        liveButton() +
        '<div class="row-btns"><button class="btn ghost" id="ly">' + (showLyrics ? "Hide lyrics" : "Lyrics") + "</button></div>" +
        (admin ? "" : '<p class="hint">Same song, same time. Join live to hear it in the group in color.</p>') +
        (showLyrics ? '<div class="panel"><h3>Lyrics</h3><p class="lead" style="white-space:pre-wrap;font-size:0.9rem">' + escapeHtml(lyrics || "Looking up…") + "</p></div>" : "") +
        (admin
          ? '<div class="panel"><h3>Add to the player</h3>' +
            '<input id="file" type="file" accept=".mp3,.m4a,.wav,.aac,.ogg,.flac,.mp4,.webm,.mov,audio/*,video/*" multiple />' +
            '<p class="hint">Files, not Photos. Audio or video. Any size.</p>' +
            "<label>YouTube, radio, Twitch, Kick, Icecast, HLS, game stream</label>" +
            '<textarea id="src" placeholder="https://youtube.com/watch?v=…  or  http://radio:8000/stream  or  https://twitch.tv/…"></textarea>' +
            '<button class="btn ghost" id="addurl" type="button">Add stream</button></div>' +
            '<div class="panel"><h3>Up next (' + ((room.queue || []).length) + ")</h3>' + rows(room.queue || [], "queue") + "</div>" +
            '<div class="panel"><h3>Library</h3>' + rows(room.library || [], "library") + "</div>"
          : '<div class="panel"><h3>Up next</h3>' + rows(room.queue || [], "listen") + "</div>") +
        (err && !busy ? '<p class="err">' + escapeHtml(err) + "</p>" : "") +
        (busy ? '<p class="err" style="color:#fde68a">' + escapeHtml(busy) + "</p>" : (!err ? '<p class="hint">Close this page — MT Radio stays on in the live chat.</p>' : "")) +
        '<p class="made">MT Radio · FutureT3ch × MemeTorrent · $MT</p>';

      ensureVideo();

      var liveEl = document.getElementById("live");
      if (liveEl) liveEl.onclick = openLive;
      var play = document.getElementById("play");
      if (play) play.onclick = function () { act("play"); };
      var skip = document.getElementById("skip");
      if (skip) skip.onclick = function () { act("skip"); };
      var ly = document.getElementById("ly");
      if (ly) ly.onclick = async function () {
        if (showLyrics) { showLyrics = false; paint(); return; }
        showLyrics = true;
        lyrics = "Looking up lyrics…";
        paint();
        try {
          const res = await fetch("/api/room", {
            method: "POST",
            headers: authHeaders(),
            body: JSON.stringify({ type: "lyrics", id: me.id, name: me.name, initData: initData }),
          });
          const data = await res.json();
          lyrics = data.lyrics || "No lyrics found.";
        } catch (e) {
          lyrics = "Could not load lyrics.";
        }
        paint();
      };
      bindFile(document.getElementById("file"));
      var src2 = document.getElementById("src");
      if (src2) {
        src2.value = srcDraft;
        src2.oninput = function () { srcDraft = src2.value; holdPaint = Date.now() + 4000; };
        src2.onfocus = function () { holdPaint = Date.now() + 8000; };
        if (hadSrc) {
          src2.focus();
          try { src2.setSelectionRange(sel, sel); } catch (e) {}
        }
      }
      var add = document.getElementById("addurl");
      if (add) {
        add.onclick = addUrl;
        add.onpointerdown = addUrl;
      }
      document.querySelectorAll("[data-q]").forEach(function (btn) {
        btn.onclick = function () { act("queue", { trackId: btn.getAttribute("data-q") }); };
      });
      document.querySelectorAll("[data-rm]").forEach(function (btn) {
        btn.onclick = function () { act("remove", { trackId: btn.getAttribute("data-rm") }); };
      });
      document.querySelectorAll("[data-del]").forEach(function (btn) {
        btn.onclick = function () { act("delete", { trackId: btn.getAttribute("data-del") }); };
      });
    }

    function bootRoom() {
      if (joined) {
        paint();
        return;
      }
      joined = true;
      paint();
      pull();
      setInterval(pull, 1000);
      setInterval(function () { if (joined) tickBar(); }, 250);
    }

    function bindFile(el) {
      if (!el || el.getAttribute("data-bound")) return;
      el.setAttribute("data-bound", "1");
      el.onchange = function (e) {
        var files = [];
        var list = e.target.files || [];
        for (var i = 0; i < list.length; i++) files.push(list[i]);
        e.target.value = "";
        files.forEach(function (f) { upload(f); });
      };
    }

    audio.addEventListener("ended", function () { if (room.isAdmin) act("skip"); });
    bindFile(document.getElementById("file-boot"));
    try { bootRoom(); } catch (e) { err = "Reload, then tap Join live."; }
  </script>
</body>
</html>
