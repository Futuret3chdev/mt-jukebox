<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>MT Radio</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0b; --elev: #141416; --subtle: #1c1c20;
      --fg: #f4f4f5; --muted: #a1a1aa; --dim: #71717a;
      --accent: #c8ccd4; --accent-fg: #0a0a0b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: "IBM Plex Sans", sans-serif; }
    .app { min-height: 100dvh; padding: 24px 16px calc(32px + env(safe-area-inset-bottom)); max-width: 28rem; margin: 0 auto; }
    audio#audio { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .brand img { width: 40px; height: 40px; object-fit: contain; }
    .kicker { font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); font-weight: 500; margin: 0; }
    h1 { font-family: Fraunces, serif; font-size: 2rem; font-weight: 500; letter-spacing: -0.03em; margin: 4px 0 8px; }
    h2 { font-family: Fraunces, serif; font-size: 1.35rem; font-weight: 500; margin: 0 0 4px; }
    p.lead { color: var(--muted); margin: 0 0 20px; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    a.btn, .btn { height: 48px; border-radius: 12px; font-weight: 600; width: 100%; display: grid; place-items: center; text-decoration: none; color: inherit; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    .btn.primary, a.btn.primary { background: var(--accent); color: var(--accent-fg); }
    .btn.ghost, a.btn.ghost { background: var(--elev); }
    .row-btns { display: flex; gap: 12px; margin: 20px 0; }
    .row-btns .btn { flex: 1; }
    .cover-wrap { display: grid; place-items: center; margin: 8px 0 20px; }
    .cover {
      width: min(72vw, 280px); height: min(72vw, 280px); border-radius: 28px; overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
      background: #111 url("/radio.jpg") center/cover no-repeat;
    }
    .cover img, .cover video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cover.live { box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 40px rgba(212,175,55,.25); }
    .now { text-align: center; margin-bottom: 8px; }
    .transport { margin: 8px 0 12px; }
    .transport .btn { width: 100%; }
    .now { text-align: center; margin-bottom: 20px; }
    .now p { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .bar { height: 4px; background: var(--subtle); border-radius: 99px; overflow: hidden; margin: 16px 0 8px; }
    .bar > span { display: block; height: 100%; background: var(--accent); width: 0; }
    .times { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; color: var(--dim); font-size: 0.75rem; }
    .meta { display: flex; justify-content: space-between; color: var(--dim); font-size: 0.8rem; }
    .panel { background: var(--elev); border-radius: 20px; padding: 16px; margin-top: 16px; }
    .panel h3 { margin: 0 0 12px; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); font-weight: 500; }
    .row { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 0; border-top: 1px solid color-mix(in oklab, var(--fg) 12%, transparent); }
    .row:first-of-type { border-top: 0; }
    .row strong { display: block; font-weight: 500; }
    .row span { color: var(--muted); font-size: 0.8rem; }
    .row button { margin-left: auto; height: 36px; padding: 0 14px; border-radius: 8px; background: var(--subtle); font-size: 0.8rem; font-weight: 500; }
    .hint, .err { color: var(--dim); font-size: 0.8rem; margin-top: 12px; }
    .err { color: #fca5a5; }
    input[type="text"], textarea {
      width: 100%; border-radius: 8px; border: 1px solid color-mix(in oklab, var(--fg) 12%, transparent);
      background: var(--bg); color: var(--fg); padding: 0 12px; margin: 8px 0 12px; font: inherit;
    }
    input[type="text"] { height: 44px; }
    textarea { min-height: 72px; padding: 10px 12px; resize: vertical; -webkit-user-select: text; user-select: text; }
    label { font-size: 0.8rem; color: var(--muted); }
    input[type="file"] { width: 100%; margin: 8px 0 4px; color: var(--fg); font: inherit; }
    .made { margin-top: 20px; color: var(--dim); font-size: 0.75rem; letter-spacing: 0.04em; text-align: center; }
    #videowrap, #ytbox { max-width: 28rem; margin: 0 auto; padding: 0 0 8px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="brand"><img src="https://memetorrent.futuret3ch.com.au/logo.png" alt="MemeTorrent" /><p class="kicker">MT Radio · $MT</p></div>
    <div class="cover-wrap">
      <div class="cover live">
        <video id="feed" src="/radio.mp4" poster="/radio.jpg" autoplay loop muted playsinline webkit-playsinline></video>
      </div>
    </div>
    <div id="ytbox"></div>
    <div class="now">
      <h2 id="np-title">MT Radio</h2>
      <p id="np-sub">Tap Play to hear it</p>
      <div class="bar"><span id="np-bar"></span></div>
      <div class="times"><span id="np-t0">0:00</span><span id="np-t1">0:00</span></div>
    </div>
    <div class="transport">
      <button type="button" class="btn primary" id="play">Play</button>
    </div>
    <div class="row-btns">
      <button type="button" class="btn ghost" id="skip">Skip</button>
      <button type="button" class="btn ghost" id="again">Again</button>
      <button type="button" class="btn ghost" id="loop">Loop on</button>
      <button type="button" class="btn primary" id="live">Live</button>
    </div>
    <p class="err" id="status"></p>
    <div class="panel" id="addpanel">
      <h3>Add to the player</h3>
      <input id="file" type="file" accept=".mp3,.m4a,.wav,.aac,.ogg,.flac,.mp4,.webm,.mov,audio/*,video/*" multiple />
      <p class="hint">Files, not Photos. Play here is only while this page is open. For sound that stays on, tap Live and join the voice chat bar at the top of SoftwareTesters.</p>
      <label>YouTube, radio, Twitch, Kick, Icecast, HLS</label>
      <textarea id="src" placeholder="https://youtube.com/watch?v=…  or  http://radio:8000/stream"></textarea>
      <button class="btn ghost" id="addurl" type="button">Add stream</button>
    </div>
    <div id="desk"></div>
  </div>
  <audio id="audio" playsinline webkit-playsinline preload="auto"></audio>
  <script>
    const LIVE = "https://t.me/+WgogJ0YgKAQzN2Q9";
    const GROUP = "https://t.me/+WgogJ0YgKAQzN2Q9";
    const LOGO = "https://memetorrent.futuret3ch.com.au/logo.png";
    const RADIO = "/radio.jpg";
    const STATION = "MT Radio";
    const TAGLINE = "MT ecosystem · made by FutureT3ch and MemeTorrent";
    const tg = window.Telegram && window.Telegram.WebApp;
    try {
      if (tg) {
        if (tg.ready) tg.ready();
        if (tg.expand) tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor("#0a0a0b");
      }
    } catch (e) {}
    const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
    const tgName = u
      ? [u.first_name, u.last_name].filter(Boolean).join(" ").trim() || u.username || "Guest"
      : "";
    let storedName = "Guest";
    try { storedName = sessionStorage.getItem("jb-name") || "Guest"; } catch (e) {}
    const me = u
      ? { id: String(u.id), name: tgName, username: u.username || "" }
      : { id: "guest-" + Math.random().toString(36).slice(2, 8), name: storedName, username: "" };
    const initData = (tg && tg.initData) || "";

    let joined = false;
    let room = { current: null, paused: true, startedAt: null, pausePos: 0, queue: [], library: [], listeners: [], hostId: null, hostName: "", isAdmin: false, live: LIVE, station: { name: STATION, tagline: TAGLINE } };
    let err = "";
    let lyrics = "";
    let showLyrics = false;
    let srcDraft = "";
    let busy = "";
    let holdPaint = 0;
    let wantPlay = false;
    const audio = document.getElementById("audio");

    function fmt(s) {
      if (!isFinite(s) || s < 0) return "0:00";
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ":" + String(sec).padStart(2, "0");
    }
    function pos() {
      if (!room.current) return 0;
      if (room.paused) return room.pausePos || 0;
      if (!room.startedAt) return 0;
      return Math.max(0, (Date.now() - room.startedAt) / 1000);
    }
    function liveHref() {
      return LIVE;
    }
    function openLive(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      wantPlay = true;
      startSound();
      chrome();
      if (room.isAdmin) act("golive");
      var href = LIVE;
      try {
        if (tg && tg.openTelegramLink) {
          tg.openTelegramLink(href);
          return false;
        }
      } catch (err) {}
      try {
        if (window.TelegramWebviewProxy && window.TelegramWebviewProxy.postEvent) {
          window.TelegramWebviewProxy.postEvent("web_app_open_tg_link", JSON.stringify({ path_full: "/+WgogJ0YgKAQzN2Q9" }));
          return false;
        }
      } catch (err2) {}
      try {
        window.open(href, "_blank");
      } catch (err3) {
        location.href = href;
      }
      return false;
    }
    function abs(url) {
      try { return new URL(url, location.origin).href; } catch (e) { return url; }
    }
    function authHeaders() {
      var h = { "Content-Type": "application/json" };
      if (initData) h["X-Telegram-Init-Data"] = initData;
      return h;
    }

    function editing() {
      var a = document.activeElement;
      if (!a) return false;
      return a.id === "src" || a.id === "file" || a.tagName === "TEXTAREA" || a.tagName === "INPUT";
    }

    async function pull() {
      try {
        const q = new URLSearchParams({ id: me.id, name: me.name });
        const res = await fetch("/api/room?" + q, { headers: authHeaders() });
        if (!res.ok) throw new Error("room");
        room = await res.json();
        if (err && /room|linked|update the room/i.test(err)) err = "";
        try {
          function songKey(t) {
            return String(t && t.title || "")
              .replace(/\.[^.]+$/, "")
              .replace(/[_-]+/g, " ")
              .replace(/\s+/g, " ")
              .trim()
              .toLowerCase() || String(t && t.url || "") || String(t && t.id || "");
          }
          function uniqueLib(list) {
            var seen = {};
            var out = [];
            (list || []).forEach(function (t) {
              var k = songKey(t);
              if (!k || seen[k]) return;
              seen[k] = 1;
              out.push(t);
            });
            return out;
          }
          var gone = [];
          try { gone = JSON.parse(localStorage.getItem("jb-gone") || "[]"); } catch (g0) { gone = []; }
          gone = (gone || []).filter(function (x) { return String(x).length > 4; });
          function notGone(t) {
            return gone.indexOf(t.id) < 0;
          }
          var server = uniqueLib(room.library || []).filter(notGone);
          var saved = [];
          try { saved = uniqueLib(JSON.parse(localStorage.getItem("jb-lib") || "[]")); } catch (s0) { saved = []; }
          saved = saved.filter(function (t) { return t && t.url && notGone(t); });
          var merged = uniqueLib(server.concat(saved));
          room.library = merged;
          if (room.isAdmin && saved.length) {
            var extra = saved.filter(function (t) {
              return !server.some(function (s) { return songKey(s) === songKey(t) || s.id === t.id; });
            });
            if (extra.length || (server.length === 0 && saved.length)) act("seed", { tracks: saved });
          }
          localStorage.setItem("jb-lib", JSON.stringify(merged.slice(0, 200)));
        } catch (e0) {}
        syncAudio();
        chrome();
        if (busy || editing() || Date.now() < holdPaint) return;
        paint();
      } catch (e) {
        if (!busy) err = "Could not reach MT Radio.";
      }
    }

    async function act(type, extra) {
      const res = await fetch("/api/room", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({ type, id: me.id, name: me.name, initData: initData, ...(extra || {}) }),
      });
      const data = await res.json().catch(function () { return {}; });
      if (res.ok) {
        room = data;
        if (!busy) err = "";
        syncAudio();
        if (!busy && !editing()) paint();
      } else {
        err = data.error || "Only group admins can DJ.";
        if (data.live) room.live = data.live;
        if (!editing()) paint();
      }
    }

    function ytId(url) {
      var m = String(url || "").match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{6,})/);
      return m ? m[1] : "";
    }
    function twitchChan(url) {
      var m = String(url || "").match(/twitch\.tv\/([A-Za-z0-9_]+)/i);
      return m ? m[1] : "";
    }
    function mediaHref() {
      var cur = room.current;
      if (!cur || cur.kind === "station") return "";
      if (["youtube", "twitch", "kick"].indexOf(cur.kind || "") >= 0) return "";
      var u = cur.playUrl || cur.url || "";
      if (!u) return "";
      if (u.indexOf("/api/") === 0) return u;
      if (u.indexOf("http") === 0) {
        if (cur.kind === "radio" || cur.kind === "stream") return u;
        return "/api/room?src=" + encodeURIComponent(u);
      }
      return "";
    }
    function playFileNow(file) {
      try { if (playFileNow.href) URL.revokeObjectURL(playFileNow.href); } catch (e0) {}
      playFileNow.href = URL.createObjectURL(file);
      wantPlay = true;
      try {
        audio.muted = false;
        audio.volume = 1;
        audio.src = playFileNow.href;
        audio.setAttribute("data-src", playFileNow.href);
        audio.play().catch(function () {});
      } catch (e) {}
      var feed = document.getElementById("feed");
      if (feed) feed.play().catch(function () {});
    }
    function isOnAir() {
      return !!wantPlay;
    }
    function syncVideo() {
      var box = document.getElementById("ytbox");
      if (!box) return;
      var cur = room.current;
      if (!wantPlay || !cur || cur.kind !== "youtube") {
        if (syncVideo.key) { box.innerHTML = ""; syncVideo.key = ""; }
        return;
      }
      var id = ytId(cur.url);
      if (!id) return;
      if (syncVideo.key === id && box.firstChild) return;
      syncVideo.key = id;
      box.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&mute=1&playsinline=1&rel=0" allow="autoplay;encrypted-media;fullscreen" allowfullscreen style="width:100%;aspect-ratio:16/9;border:0;border-radius:12px;margin:0 0 12px"></iframe>';
    }
    function startSound() {
      var cur = room.current;
      if (cur && ["youtube", "twitch", "kick"].indexOf(cur.kind || "") >= 0) {
        try { audio.pause(); } catch (e0) {}
        syncVideo();
        return;
      }
      var feed = document.getElementById("feed");
      if (feed) {
        try {
          feed.muted = true;
          feed.playsInline = true;
          feed.play().catch(function () {});
        } catch (e1) {}
      }
      var href = mediaHref();
      if (!href) {
        try { audio.pause(); } catch (e0) {}
        return;
      }
      try {
        audio.muted = false;
        audio.volume = 1;
        if (audio.getAttribute("data-src") !== href) {
          audio.src = href;
          audio.setAttribute("data-src", href);
        }
      } catch (e) {}
      audio.play().catch(function () {});
    }
    function syncAudio() {
      var feed = document.getElementById("feed");
      if (feed) feed.play().catch(function () {});
      if (wantPlay && audio.paused) startSound();
      syncVideo();
    }
    async function hitPlay() {
      wantPlay = !wantPlay;
      if (wantPlay) {
        err = "";
        if (room.isAdmin) {
          try { await act("play"); } catch (e1) {}
          try { await act("golive"); } catch (e2) {}
        }
        startSound();
        syncVideo();
      } else {
        try { audio.pause(); } catch (e) {}
        if (room.isAdmin) act("pause");
      }
      chrome();
    }
    function chrome() {
      var cur = room.current;
      var onAir = wantPlay;
      var titleEl = document.getElementById("np-title");
      var subEl = document.getElementById("np-sub");
      var playEl = document.getElementById("play");
      var st = document.getElementById("status");
      if (titleEl) titleEl.textContent = cur && cur.kind !== "station" ? cur.title : STATION;
      if (subEl) subEl.textContent = onAir ? ((cur && cur.kind !== "station" ? ((cur.artist || "") + (cur.addedBy ? " · " + cur.addedBy : "")) : "MT Radio live")) : "Tap Play to hear it";
      if (playEl) playEl.textContent = onAir ? "Pause" : "Play";
      var loopEl = document.getElementById("loop");
      if (loopEl) loopEl.textContent = room.loop === false ? "Loop off" : "Loop on";
      if (st) st.textContent = busy || err || "";
      tickBar();
    }

    async function hostFile(file) {
      try {
        var fd2 = new FormData();
        fd2.append("reqtype", "fileupload");
        fd2.append("fileToUpload", file);
        var r2 = await fetch("https://catbox.moe/user/api.php", { method: "POST", body: fd2 });
        var t = (await r2.text()).trim();
        if (t.indexOf("http") === 0) return t;
      } catch (e) {}
      try {
        var fd3 = new FormData();
        fd3.append("reqtype", "fileupload");
        fd3.append("fileToUpload", file);
        var r3 = await fetch("https://litterbox.catbox.moe/resources/internals/api.php", { method: "POST", body: fd3 });
        var t3 = (await r3.text()).trim();
        if (t3.indexOf("http") === 0) return t3;
      } catch (e2) {}
      try {
        var fd = new FormData();
        fd.append("file", file);
        var r = await fetch("https://tmpfiles.org/api/v1/upload", { method: "POST", body: fd });
        var j = await r.json();
        var u = j && j.data && j.data.url;
        if (u) return String(u).replace("://tmpfiles.org/", "://tmpfiles.org/dl/");
      } catch (e3) {}
      return "";
    }

    async function upload(file) {
      bootRoom();
      if (!file) return;
      if (!room.isAdmin) {
        err = "Checking access…";
        chrome();
        try { await pull(); } catch (e0) {}
      }
      if (!room.isAdmin) {
        err = "Only group admins can add tracks. Tap Play to listen.";
        chrome();
        return;
      }
      if (file.size < 200) {
        err = "That pick was empty. Use Files, not Photos.";
        chrome();
        return;
      }
      var nameKey = file.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").replace(/\s+/g, " ").trim().toLowerCase();
      var have = (room.library || []).some(function (t) {
        var k = String(t.title || "").replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").replace(/\s+/g, " ").trim().toLowerCase();
        return k === nameKey;
      });
      if (have) {
        err = file.name + " is already in the library.";
        chrome();
        return;
      }
      busy = "Adding " + file.name + "…";
      err = "Adding " + file.name + "…";
      holdPaint = Date.now() + 20000;
      playFileNow(file);
      chrome();
      try {
        var posted = false;
        var durable = await hostFile(file);
        if (file.size < 4200000) {
          try {
            var up = await fetch("/api/room?title=" + encodeURIComponent(file.name.replace(/\.[^.]+$/, "")) + "&name=" + encodeURIComponent(me.name) + "&id=" + encodeURIComponent(me.id), {
              method: "POST",
              headers: { "Content-Type": file.type || "audio/mpeg", "X-Telegram-Init-Data": initData },
              body: file
            });
            if (up.ok) {
              var data = await up.json();
              Object.assign(room, data);
              posted = true;
            }
          } catch (e0) {}
        }
        if (durable) {
          var idle = !room.current || room.current.kind === "station";
          await act("addUrl", { url: durable, title: file.name.replace(/\.[^.]+$/, ""), playNow: !posted && idle });
          posted = true;
        }
        if (!posted) {
          err = "Could not send " + file.name + ". Try again, or send the file to @Mtradiobot.";
          busy = "";
          chrome();
          return;
        }
        wantPlay = true;
        busy = "";
        err = "Added " + file.name;
        try {
          var lib = (room.library || []).slice();
          localStorage.setItem("jb-lib", JSON.stringify(lib.slice(0, 200)));
        } catch (e1) {}
        chrome();
        paint();
      } catch (e) {
        err = "Could not add " + file.name + ". Send it to @Mtradiobot.";
        busy = "";
        chrome();
      }
    }

    async function addUrl(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      if (addUrl.lock && Date.now() < addUrl.lock) return;
      addUrl.lock = Date.now() + 1500;
      holdPaint = Date.now() + 4000;
      var el = document.getElementById("src");
      var url = ((el && el.value) || srcDraft || "").trim();
      srcDraft = url;
      if (!url) {
        err = "Paste a YouTube, radio, or stream link first.";
        chrome();
        return;
      }
      busy = "Adding stream…";
      err = "Adding stream…";
      chrome();
      try {
        var idle = !room.current || room.current.kind === "station";
        await act("addUrl", { url: url, title: "", playNow: idle });
        srcDraft = "";
        err = idle ? "Playing now. Tap Play if you do not hear it." : "Queued.";
        wantPlay = wantPlay || idle;
        syncAudio();
      } catch (e2) {
        err = "Could not add that stream.";
      }
      busy = "";
      chrome();
      paint();
    }

    function rows(list, mode) {
      if (!list.length) return '<p class="hint">' + (mode === "queue" ? "Nothing queued" : "No files yet") + "</p>";
      return list.map(function (tr) {
        var btns = "";
        if (room.isAdmin && mode === "queue") btns = '<button data-rm="' + tr.id + '">Remove</button>';
        if (room.isAdmin && mode === "library") btns = '<button data-q="' + tr.id + '">Queue</button><button data-del="' + tr.id + '">Delete</button>';
        return '<div class="row"><div><strong>' + escapeHtml(tr.title) + "</strong><span>" + escapeHtml((tr.kind ? tr.kind + " · " : "") + (tr.artist || tr.addedBy || "")) + "</span></div>" + btns + "</div>";
      }).join("");
    }

    function escapeHtml(s) {
      return String(s || "").replace(/[&<>"']/g, function (c) {
        if (c === "&") return "&";
        if (c === "<") return "<";
        if (c === ">") return ">";
        if (c === '"') return "&#34;";
        return "&#39;";
      });
    }

    function tickBar() {
      const bar = document.getElementById("np-bar");
      const t0 = document.getElementById("np-t0");
      const t1 = document.getElementById("np-t1");
      if (!bar) return;
      const dur = (room.current && (room.current.duration || audio.duration)) || 0;
      const t = pos();
      bar.style.width = dur ? Math.min(100, (t / dur) * 100) + "%" : "0";
      if (t0) t0.textContent = fmt(t);
      if (t1) t1.textContent = fmt(dur);
    }

    function liveButton() {
      return "";
    }

    function paint() {
      chrome();
      var desk = document.getElementById("desk");
      if (!desk) return;
      desk.innerHTML =
        (showLyrics ? '<div class="panel"><h3>Lyrics</h3><p class="lead" style="white-space:pre-wrap;font-size:0.9rem">' + escapeHtml(lyrics || "Looking up…") + "</p></div>" : "") +
        '<div class="row-btns"><button class="btn ghost" id="ly">' + (showLyrics ? "Hide lyrics" : "Lyrics") + "</button></div>" +
        '<div class="panel"><h3>Up next (' + ((room.queue || []).length) + ')</h3>' + rows(room.queue || [], room.isAdmin ? "queue" : "listen") + "</div>" +
        (room.isAdmin ? '<div class="panel"><h3>Library</h3>' + rows(room.library || [], "library") + "</div>" : "") +
        '<p class="made">MT Radio · FutureT3ch × MemeTorrent · $MT</p>';
      var ly = document.getElementById("ly");
      if (ly) ly.onclick = async function () {
        if (showLyrics) { showLyrics = false; paint(); return; }
        showLyrics = true;
        lyrics = "Looking up lyrics…";
        paint();
        try {
          const res = await fetch("/api/room", {
            method: "POST",
            headers: authHeaders(),
            body: JSON.stringify({ type: "lyrics", id: me.id, name: me.name, initData: initData }),
          });
          const data = await res.json();
          lyrics = data.lyrics || "No lyrics found.";
        } catch (e2) {
          lyrics = "Could not load lyrics.";
        }
        paint();
      };
      document.querySelectorAll("[data-q]").forEach(function (btn) {
        btn.onclick = function () { act("queue", { trackId: btn.getAttribute("data-q") }); };
      });
      document.querySelectorAll("[data-rm]").forEach(function (btn) {
        btn.onclick = function () { act("remove", { trackId: btn.getAttribute("data-rm") }); };
      });
      document.querySelectorAll("[data-del]").forEach(function (btn) {
        btn.onclick = function () {
          var id = btn.getAttribute("data-del");
          var t = (room.library || []).filter(function (x) { return x.id === id; })[0];
          try {
            var gone = JSON.parse(localStorage.getItem("jb-gone") || "[]");
            gone = (gone || []).filter(function (x) { return String(x).length > 4; });
            if (id && gone.indexOf(id) < 0) gone.push(id);
            localStorage.setItem("jb-gone", JSON.stringify(gone));
            room.library = (room.library || []).filter(function (x) { return x.id !== id; });
            localStorage.setItem("jb-lib", JSON.stringify(room.library));
          } catch (e1) {}
          paint();
          act("delete", { trackId: id, title: t && t.title });
        };
      });
    }

    function bootRoom() {
      if (joined) {
        paint();
        return;
      }
      joined = true;
      paint();
      chrome();
      syncAudio();
      pull();
      setInterval(pull, 1000);
      setInterval(function () { if (joined) tickBar(); }, 250);
    }

    function bindFile(el) {
      if (!el || el.getAttribute("data-bound")) return;
      el.setAttribute("data-bound", "1");
      el.onchange = function (e) {
        var files = [];
        var list = e.target.files || [];
        for (var i = 0; i < list.length; i++) files.push(list[i]);
        e.target.value = "";
        files.forEach(function (f) { upload(f); });
      };
    }

    audio.addEventListener("ended", function () {
      if (!isFinite(audio.duration) || audio.duration < 2) return;
      if (room.loop !== false) {
        try { audio.currentTime = 0; audio.play(); } catch (e) {}
        return;
      }
      if (room.isAdmin) act("skip");
    });
    try {
      bindFile(document.getElementById("file"));
      var live0 = document.getElementById("live");
      if (live0) live0.addEventListener("click", openLive);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden && wantPlay) startSound();
      });
      var play0 = document.getElementById("play");
      if (play0) play0.onclick = hitPlay;
      var feed0 = document.getElementById("feed");
      if (feed0) {
        feed0.muted = true;
        feed0.loop = true;
        feed0.playsInline = true;
        feed0.play().catch(function () {});
      }
      document.addEventListener("touchstart", function kick() {
        var v = document.getElementById("feed");
        if (v) v.play().catch(function () {});
      }, { once: true });
      var skip0 = document.getElementById("skip");
      if (skip0) skip0.onclick = function () { act("skip"); };
      var again0 = document.getElementById("again");
      if (again0) again0.onclick = function () { wantPlay = true; act("replay"); syncAudio(); chrome(); };
      var loop0 = document.getElementById("loop");
      if (loop0) loop0.onclick = function () { act("loop"); };
      var add0 = document.getElementById("addurl");
      if (add0) add0.onclick = addUrl;
      var src0 = document.getElementById("src");
      if (src0) {
        src0.oninput = function () { srcDraft = src0.value; holdPaint = Date.now() + 8000; };
        src0.onfocus = function () { holdPaint = Date.now() + 12000; };
      }
      var file0 = document.getElementById("file");
      if (file0) file0.addEventListener("click", function () { holdPaint = Date.now() + 60000; });
      bootRoom();
    } catch (e) {
      err = String(e && e.message ? e.message : e);
      try { document.getElementById("app").insertAdjacentHTML("beforeend", '<p class="err">' + err + "</p>"); } catch (e2) {}
    }
  </script>
</body>
</html>
